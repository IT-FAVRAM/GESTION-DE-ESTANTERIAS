<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Gestor de Estanterías</title>
    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      
      /* Ensure touch scrolling is smooth */
      .smooth-scroll {
        -webkit-overflow-scrolling: touch;
      }

      /* Prevent pull-to-refresh on mobile if needed, usually managed by overflow behavior */
      body {
        overscroll-behavior-y: none;
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white transition-colors duration-300 selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const serviceWorkerUrl = new URL('/firebase-messaging-sw.js', window.location.origin);
          const firebaseConfig = {
            apiKey: '%VITE_FIREBASE_API_KEY%',
            authDomain: '%VITE_FIREBASE_AUTH_DOMAIN%',
            projectId: '%VITE_FIREBASE_PROJECT_ID%',
            storageBucket: '%VITE_FIREBASE_STORAGE_BUCKET%',
            messagingSenderId: '%VITE_FIREBASE_MESSAGING_SENDER_ID%',
            appId: '%VITE_FIREBASE_APP_ID%',
            measurementId: '%VITE_FIREBASE_MEASUREMENT_ID%'
          };

          Object.entries(firebaseConfig).forEach(([key, value]) => {
            if (value && !value.startsWith('%VITE_')) {
              serviceWorkerUrl.searchParams.set(key, value);
            }
          });

          navigator.serviceWorker.register(serviceWorkerUrl).then(
            (registration) => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            },
            (err) => {
              console.log('ServiceWorker registration failed: ', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
