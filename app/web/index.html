<!DOCTYPE html>
<html lang="es">
  <head>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.right = '0';
        errorDiv.style.backgroundColor = 'red';
        errorDiv.style.color = 'white';
        errorDiv.style.zIndex = '999999';
        errorDiv.style.padding = '20px';
        errorDiv.style.fontFamily = 'monospace';
        errorDiv.style.fontSize = '12px';
        errorDiv.style.wordBreak = 'break-all';
        errorDiv.innerHTML = '<strong>FATAL ERROR:</strong><br/>' + 
          message + '<br/><br/>' + 
          'Source: ' + source + ':' + lineno + ':' + colno + '<br/><br/>' + 
          (error && error.stack ? error.stack.replace(/\n/g, '<br/>') : '');
        document.body.appendChild(errorDiv);
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        window.onerror('Unhandled Promise Rejection: ' + (event.reason && event.reason.message ? event.reason.message : event.reason), null, 0, 0, event.reason);
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="permissions-policy" content="camera=*, microphone=*, geolocation=*" />
    <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*, geolocation=*" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Cpath d='M16 22 32 14l16 8-16 8-16-8Zm0 9 16 8 16-8M16 40l16 8 16-8' fill='none' stroke='%2322d3ee' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Gestor de Estanterías</title>
    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }

      /* Ensure touch scrolling is smooth */
      .smooth-scroll {
        -webkit-overflow-scrolling: touch;
      }

      /* Prevent pull-to-refresh on mobile if needed, usually managed by overflow behavior */
      body {
        overscroll-behavior-y: none;
      }

      /* Landscape tablet: ensure full width viewport without margins */
      @media screen and (orientation: landscape) {
        html, body, #root {
          width: 100vw;
          height: 100vh;
          margin: 0;
          padding: 0;
          border: 0;
        }
      }

      /* Kiosk orientation: force landscape on ALL touch devices via CSS rotation fallback */
      @media screen and (orientation: portrait) and (pointer: coarse) {
        #orientation-overlay {
          display: flex !important;
        }
      }
    </style>
</head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white transition-colors duration-300 selection:bg-cyan-500 selection:text-white">
    <!-- Landscape overlay for portrait tablets -->
    <div id="orientation-overlay" style="display:none;position:fixed;inset:0;z-index:99999;background:#0f172a;align-items:center;justify-content:center;flex-direction:column;gap:16px;">
      <div style="font-size:56px;">📱</div>
      <p style="color:#e2e8f0;font-family:sans-serif;font-size:18px;font-weight:700;margin:0;">Gira la tablet</p>
      <p style="color:#94a3b8;font-family:sans-serif;font-size:13px;margin:0;">La aplicación funciona en horizontal</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // ─── Chunk Loading Diagnostics ───────────────────────────────────────
      window.__CHUNK_LOAD_LOG__ = [];
      const observer = new PerformanceObserver((list) => {
        for (const entry of list.getEntries()) {
          if (entry.name.includes('/assets/')) {
            window.__CHUNK_LOAD_LOG__.push({
              name: entry.name.split('/').pop(),
              type: entry.initiatorType,
              duration: entry.duration.toFixed(2),
              size: (entry.transferSize / 1024).toFixed(2) + ' KB',
              time: new Date().toLocaleTimeString(),
            });
          }
        }
      });
      observer.observe({ entryTypes: ['resource'] });
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const serviceWorkerUrl = new URL('/firebase-messaging-sw.js', window.location.origin);
          const firebaseConfig = {
            apiKey: '%VITE_FIREBASE_API_KEY%',
            authDomain: '%VITE_FIREBASE_AUTH_DOMAIN%',
            projectId: '%VITE_FIREBASE_PROJECT_ID%',
            storageBucket: '%VITE_FIREBASE_STORAGE_BUCKET%',
            messagingSenderId: '%VITE_FIREBASE_MESSAGING_SENDER_ID%',
            appId: '%VITE_FIREBASE_APP_ID%',
            measurementId: '%VITE_FIREBASE_MEASUREMENT_ID%'
          };

          Object.entries(firebaseConfig).forEach(([key, value]) => {
            if (value && !value.startsWith('%VITE_')) {
              serviceWorkerUrl.searchParams.set(key, value);
            }
          });

          navigator.serviceWorker.register(serviceWorkerUrl).then(
            (registration) => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            },
            (err) => {
              console.log('ServiceWorker registration failed: ', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
